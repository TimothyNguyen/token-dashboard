name: TokenDashboardCompanion
options:
  bundleIdPrefix: com.token-dashboard
  xcodeVersion: "15.4"
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.token_dashboard.companion
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: TokenDashboardCompanion/Info.plist
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_HARDENED_RUNTIME: YES

targets:
  TokenDashboardCompanion:
    type: application
    platform: macOS
    sources:
      - path: TokenDashboardCompanion
        excludes:
          - "Info.plist"
    resources:
      - path: TokenDashboardCompanion/Assets.xcassets
    info:
      path: TokenDashboardCompanion/Info.plist
      properties:
        LSUIElement: true
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    settings:
      base:
        PRODUCT_NAME: TokenDashboardCompanion

  TokenDashboardCompanionTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - TokenDashboardCompanionTests
    dependencies:
      - target: TokenDashboardCompanion
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/TokenDashboardCompanion.app/Contents/MacOS/TokenDashboardCompanion
